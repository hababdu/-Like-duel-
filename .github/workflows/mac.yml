name: Mac desktop (DMG)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend build
        working-directory: frontend
        env:
          CI: 'false'
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'https://telegram-bot-server-2-matj.onrender.com' }}
          REACT_APP_GOOGLE_WEB_CLIENT_ID: ${{ vars.REACT_APP_GOOGLE_WEB_CLIENT_ID }}
          REACT_APP_STORE_BUILD: 'false'
        run: |
          npm ci
          npm run build

      - name: Build DMG
        working-directory: desktop
        run: |
          rm -rf web && cp -R ../frontend/build web
          npm install
          # hdiutil GitHub macOS runner'larda vaqti-vaqti bilan xato beradi: 3 marta urinamiz
          ok=0
          for i in 1 2 3; do
            hdiutil info | grep -o '/dev/disk[0-9]*' | sort -u | while read d; do hdiutil detach -force "$d" >/dev/null 2>&1 || true; done
            rm -rf dist
            if npm run dist:mac > build.log 2>&1; then ok=1; break; fi
          done
          [ "$ok" = 1 ] || {
            msg=$(tail -60 build.log | tr -d '%\r' | awk '{printf "%s%%0A", $0}')
            echo "::error title=DMG xatosi::$msg"
            exit 1
          }
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: like-duel-mac
          path: desktop/dist/*.zip
