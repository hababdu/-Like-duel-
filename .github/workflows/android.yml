name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Frontend build
        working-directory: frontend
        env:
          CI: 'false'
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'https://telegram-bot-server-2-matj.onrender.com' }}
          REACT_APP_GOOGLE_WEB_CLIENT_ID: ${{ vars.REACT_APP_GOOGLE_WEB_CLIENT_ID }}
          REACT_APP_GOOGLE_IOS_CLIENT_ID: ${{ vars.REACT_APP_GOOGLE_IOS_CLIENT_ID }}
          REACT_APP_STORE_BUILD: ${{ vars.REACT_APP_STORE_BUILD || 'false' }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: like-duel-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
